name: Build PixelOS 13 GSI

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Maximize Build Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /etc/apt/sources.list.d/*
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/doc/
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /var/lib/docker
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/share/phantomjs*
          sudo apt-get clean
          echo "=== Cleaned ==="
          df -h

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf lib32ncurses5-dev lib32z1-dev libc6-dev-i386 libncurses5 libncurses5-dev libreadline-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 xz-utils

      - name: Set up Repo Tool
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync PixelOS Source & Apply Patches
        run: |
          mkdir gsi && cd gsi
          repo init -u https://github.com/PixelOS-AOSP/manifest.git -b thirteen --depth=1
          git clone https://github.com/MisterZtr/PixelOS_gsi.git -b 13 .repo/local_manifests
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags
          bash .repo/local_manifests/apply-patches.sh .

      - name: Generate Rom Makefile
        run: |
          cd gsi
          cp .repo/local_manifests/pixel.mk device/phh/treble/
          cd device/phh/treble
          bash generate.sh pixel

      - name: Free Space by Deleting repo
        run: |
          cd gsi
          df -h
          rm -rf .repo
          df -h

      - name: Build GSI
        run: |
          cd gsi
          source build/envsetup.sh
          lunch treble_arm64_bvN-userdebug
          make systemimage -j$(nproc)

      - name: Compress system.img
        run: |
          cd gsi/out/target/product/*
          xz -z -k -3 system.img

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelOS-13-GSI
          path: gsi/out/target/product/*/system.img.xz
